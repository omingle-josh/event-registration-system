name: CI

on:
  push:
    branches: 
      - main
      - develop
  pull_request: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      
      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn --version
