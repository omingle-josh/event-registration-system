server.port=8082
spring.application.name=event-service

# Database Configuration
spring.datasource.url=${DB_URL}?currentSchema=event_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon DB SSL Configuration
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Comma-separated origins allowed to call this service directly.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Groq AI Configuration
groq.api-key=${GROQ_API_KEY:placeholder}
groq.model-id=llama-3.1-8b-instant

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=always

info.app.name=Event Service
info.app.version=1.0.0
management.endpoints.web.exposure.include=health,info
