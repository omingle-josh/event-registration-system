server.port=8081
server.servlet.session.cookie.same-site=lax
spring.application.name=auth-service

# Database Configuration
spring.datasource.url=${DB_URL}?currentSchema=auth_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon DB SSL Configuration
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
auth.cleanup.cron=0 0 * * * *

# Comma-separated origins allowed to call this service directly.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Mail (SMTP) Configuration - Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=forsus9307@gmail.com
spring.mail.password=ekay ajzn nlot nkcf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=forsus9307@gmail.com

# OAuth2 Google Configuration
# Gateway Integration
server.forward-headers-strategy=framework

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
# We use this as a redirect target after successful authentication in handlers
oauth2.success.redirect-uri=http://localhost:5173/auth/oauth2/redirect

# Debugging OAuth2
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=always

info.app.name=Auth Service
info.app.version=1.0.0
