server.port=8083
spring.application.name=registration-service

# Database Configuration
spring.datasource.url=${DB_URL}?currentSchema=registration_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon DB SSL Configuration
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Comma-separated origins allowed to call this service directly.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# External Financial Providers
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Feign Client Timeouts (prevents async threads from hanging on slow event-service)
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# Mail (SMTP) Configuration - Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=forsus9307@gmail.com
spring.mail.password=ekay ajzn nlot nkcf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=forsus9307@gmail.com

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=always
